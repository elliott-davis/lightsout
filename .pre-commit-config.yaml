default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: fmt-check
        name: make fmt-check
        entry: make -s fmt-check
        language: system
        files: '(\.go|go\.mod|go\.sum)$'
        pass_filenames: false
        stages: [pre-commit]
      - id: tidy-check
        name: make tidy-check
        entry: make -s tidy-check
        language: system
        files: '(\.go|go\.mod|go\.sum)$'
        pass_filenames: false
        stages: [pre-commit]
      - id: dco
        name: DCO sign-off
        entry: scripts/check-dco.sh --msg-file
        language: system
        stages: [commit-msg]
